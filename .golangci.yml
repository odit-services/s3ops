version: "2"
run:
  timeout: 5m
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unparam
    - unused
    - copyloopvar
    - dupl
    - goconst
    - gocyclo
    - misspell
    - nakedret
    - prealloc
  exclusions:
    generated: lax
    rules:
      - path: internal/
        linters:
          - dupl
          - misspell
      - path: api/
        linters:
          - misspell
      - path: _test\.go
        linters:
          - dupl
          - goconst
formatters:
  enable:
    - gofmt
